name: Multi-Platform Build Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Install Python dependencies
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Linux-specific setup
    - name: Install ARM toolchain (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi openocd

    # macOS-specific setup
    - name: Install ARM toolchain (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install --cask gcc-arm-embedded
        brew install openocd

    # Windows-specific setup
    - name: Install ARM toolchain (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install gcc-arm-embedded -y
        # Note: OpenOCD installation on Windows is more complex

    - name: Run platform compatibility tests
      shell: bash
      run: |
        python test_platform.py --ci-mode
