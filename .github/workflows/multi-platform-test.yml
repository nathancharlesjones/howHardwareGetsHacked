name: Multi-Platform Build Test

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # Windows WSL setup - do this before other setup
    - name: Setup WSL (Windows only)
      if: runner.os == 'Windows'
      uses: Vampire/setup-wsl@v3
      with:
        distribution: Ubuntu-22.04

    # Set up Python (Linux and macOS)
    - name: Set up Python
      if: runner.os != 'Windows'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Used cached Python dependencies, if available
    - name: Use cached Python dependencies (if available)
      if: runner.os != 'Windows'
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('setup/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Install Python dependencies (Linux and macOS)
    - name: Install Python dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r setup/requirements.txt

    # Linux-specific setup
    - name: Install ARM toolchain (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi openocd xterm

    # macOS-specific setup
    # Remove the pre-installed, untrusted aws/tap so it stops triggering a
    # "taps are not trusted" warning on every subsequent brew command.
    - name: Untap unwanted Homebrew taps (macOS)
      if: runner.os == 'macOS'
      run: brew untap aws/tap || true

    - name: Install ARM toolchain (macOS)
      if: runner.os == 'macOS'
      uses: carlosperate/arm-none-eabi-gcc-action@v1

    - name: Install other tools (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install openocd
        # XQuartz provides X11 support needed for xterm
        brew install --cask xquartz
        brew install xterm

    # Windows WSL setup - install everything inside WSL
    - name: Install dependencies in WSL (Windows)
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip gcc-arm-none-eabi openocd xterm
        pip3 install -r setup/requirements.txt

    # Run platform compatibility tests (Linux and macOS)
    - name: Run platform compatibility tests
      if: runner.os != 'Windows'
      shell: bash
      run: |
        python setup/test_platform.py --ci-mode

    # Run platform compatibility tests in WSL (Windows)
    - name: Run platform compatibility tests in WSL (Windows)
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        python3 setup/test_platform.py --ci-mode

    # Test build system with console build (Linux and macOS)
    - name: Test build system (console)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Build console car and fobs (software-only, no hardware needed)
        scons platform=sim role=car id=12345 ui=console
        scons platform=sim role=paired_fob id=12345 pin=123456 ui=console
        scons platform=sim role=unpaired_fob ui=console

    # Test build system with console build in WSL (Windows)
    - name: Test build system (console) in WSL (Windows)
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        # Build console car and fobs (software-only, no hardware needed)
        scons platform=sim role=car id=12345 ui=console
        scons platform=sim role=paired_fob id=12345 pin=123456 ui=console
        scons platform=sim role=unpaired_fob ui=console

    # Run functional tests with simulation (Linux and macOS)
    - name: Run functional tests with simulation
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Run all software-only tests using simulation
        pytest testing/test_functional.py -v

    # Run functional tests with simulation in WSL (Windows)
    - name: Run functional tests with simulation in WSL (Windows)
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        # Run all software-only tests using simulation
        pytest testing/test_functional.py -v

    # Run security tests with simulation (Linux and macOS)
    - name: Run security tests with simulation
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Run all software-only tests using simulation
        pytest testing/test_security.py -v

    # Run security tests with simulation in WSL (Windows)
    - name: Run security tests with simulation in WSL (Windows)
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        # Run all software-only tests using simulation
        pytest testing/test_security.py -v