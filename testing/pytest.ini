[pytest]
markers =
    car1: eCTF Car #1 scenario — attacker has a car, unpaired fob, and two packaged features
    car2: eCTF Car #2 scenario — attacker has a car, temporary access to a paired fob, unpaired fob, and two packaged features
    car3: eCTF Car #3 scenario — attacker has a car, unpaired fob, logic analyzer capture of 3 successful unlock sequences, and two packaged features
    car4: eCTF Car #4 scenario — attacker has a car, unpaired fob, pairing pin, and two packaged features
    car5: eCTF Car #5 scenario — attacker has a car, paired fob, unpaired fob, and one packaged feature
    hardware_only: test requires real hardware; skipped automatically in simulation mode (no --using)

addopts = --tb=short
